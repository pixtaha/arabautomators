<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Arab Automators login code</title>
  </head>
  <body style="margin:0;padding:0;background:#ffffff;font-family:Arial,Helvetica,sans-serif;color:#111111">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0">
      Use this one-time code to log in to Arab Automators.
    </div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td align="center" style="padding:40px 16px">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px">
            <tr>
              <td align="center" style="padding-bottom:24px;font-size:22px;font-weight:800">
                <span style="color:#007858">A</span>rab <span style="color:#007858">A</span>utomators
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:40px;border:1px solid #e5e5e5;border-radius:12px">
                <h1 style="margin:0 0 14px;font-size:26px;line-height:32px">Your login code</h1>
                <p style="margin:0 0 28px;font-size:15px;line-height:24px;color:#525252">
                  Enter this one-time code on the login page. It can only be used once.
                </p>
                <div style="display:inline-block;padding:16px 24px;border-radius:8px;background:#f1f8f6;font-family:monospace;font-size:32px;font-weight:700;letter-spacing:8px;color:#007858">
                  {{ .Token }}
                </div>
                <p style="margin:28px 0 0;font-size:12px;line-height:18px;color:#a3a3a3">
                  If you did not request this code, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
